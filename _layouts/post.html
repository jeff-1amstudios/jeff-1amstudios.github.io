---
layout: default
---
<article class="article-shell">
  <div class="article">
    <h1>{{ page.title }}</h1>
    {{ content }}
  </div>
</article>

<nav class="post-pagination" aria-label="More from the archive">
  {% if page.previous.url %}<a href="{{ page.previous.url }}"><span>Previous</span>{{ page.previous.title }}</a>{% endif %}
  {% if page.next.url %}<a href="{{ page.next.url }}"><span>Next</span>{{ page.next.title }}</a>{% endif %}
</nav>
